---
# Copy into .github/workflows/ of one central repo (an org's ops repo, or
# your own) to keep every repo the owner has fresh from there. The covered
# repos need no workflow of their own: this job clones each, plans its
# updates, pushes each group to doneram/<group>, and opens or updates that
# group's draft pull request.
#
# Token: a GitHub App installed on the repos with contents, pull requests,
# and workflows (read and write) permissions, its client ID and private key
# in DONERAM_APP_CLIENT_ID and DONERAM_APP_PRIVATE_KEY. Without the app,
# DONERAM_FLEET_TOKEN holds a fine-grained personal access token with the
# same permissions. The job's own GITHUB_TOKEN reaches this repo only.
#
# Each covered repo's validate, afterPatch, and tool commands run in this
# job. doneram removes the write token from their environment before any of
# them runs and puts DONERAM_READ_TOKEN (the job's own read-only token here,
# for registry rate limits) in its place, so a repo's code cannot push to
# the others. They still run with this job's network and runner, so cover
# repos whose config you would run in CI.
name: Fleet

"on":
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report only: push nothing and open no pull requests"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: doneram-fleet
  cancel-in-progress: false

jobs:
  fleet:
    runs-on: ubuntu-latest
    env:
      HAS_APP: ${{ secrets.DONERAM_APP_CLIENT_ID != '' }}
    steps:
      # Set version to a doneram release that ships `fleet`.
      - uses: kyleking/doneram@c5120304a06b6c524a9b96dd6408b01e8b453e65 # v0.5.1
        with:
          version: latest

      # mise answers the tool resolvers.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      # Scoped to the owner with no repository list, the installation token
      # covers every repo the app is installed on.
      - id: app-token
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.DONERAM_APP_CLIENT_ID }}
          private-key: ${{ secrets.DONERAM_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.DONERAM_FLEET_TOKEN }}
          DONERAM_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(--org "$OWNER" --json fleet.json)
          if [ "${DRY_RUN:-false}" = "true" ]; then
            args+=(--dry-run)
          fi
          doneram fleet "${args[@]}"

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fleet-report
          path: fleet.json
          if-no-files-found: ignore
