name: 'doneram'
description: 'Install a pinned doneram release binary onto PATH'
author: 'kyleking'

branding:
  icon: 'package'
  color: 'orange'

inputs:
  version:
    description: 'doneram version to install (default: latest release)'
    required: false
    default: 'latest'

runs:
  using: 'composite'
  steps:
    - name: Resolve version
      id: version
      shell: bash
      run: |
        set -euo pipefail
        if [ "${{ inputs.version }}" = "latest" ]; then
          VERSION=$(curl -fsSL https://api.github.com/repos/kyleking/doneram/releases/latest | grep '"tag_name"' | sed -E 's/.*"([^"]+)".*/\1/')
        else
          VERSION="${{ inputs.version }}"
        fi
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

    - name: Install doneram
      shell: bash
      run: |
        set -euo pipefail
        case "${{ runner.os }}" in
          Linux) OS=linux ;;
          macOS) OS=darwin ;;
          Windows) OS=windows ;;
          *) echo "unsupported runner.os: ${{ runner.os }}" >&2; exit 1 ;;
        esac
        case "${{ runner.arch }}" in
          X64) ARCH=amd64 ;;
          ARM64) ARCH=arm64 ;;
          *) echo "unsupported runner.arch: ${{ runner.arch }}" >&2; exit 1 ;;
        esac

        VERSION="${{ steps.version.outputs.version }}"
        BIN="doneram-${OS}-${ARCH}"
        DEST_DIR="${RUNNER_TEMP}/doneram-bin"
        DEST="${DEST_DIR}/doneram"
        if [ "$OS" = "windows" ]; then
          BIN="${BIN}.exe"
          DEST="${DEST}.exe"
        fi

        URL="https://github.com/kyleking/doneram/releases/download/${VERSION}/${BIN}"
        echo "Installing doneram ${VERSION} from ${URL}"

        mkdir -p "$DEST_DIR"
        curl -fsSL -o "$DEST" "$URL"
        chmod +x "$DEST"

        echo "$DEST_DIR" >> "$GITHUB_PATH"
