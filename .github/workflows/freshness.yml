---
name: Freshness

"on":
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # Applies every update to a throwaway checkout, runs the config's validate
  # command, bisects any failure, and splits the changes into groups: one
  # PR for security fixes and routine updates, one per major that needs
  # review, and one per bump that breaks validation.
  plan:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
      plan: ${{ steps.groups.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # pkl evaluates .doneram.pkl and mise answers the tool resolvers.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./cmd/doneram update --output /tmp/plan.json

      # The plan's own Go module upgrade puts "updates" in its groups
      # whenever go.mod moves, so the list is used as it stands.
      - id: groups
        env:
          IDS: ${{ steps.plan.outputs.groups }}
        run: |
          set -euo pipefail
          echo "groups=${IDS:-[]}" >> "$GITHUB_OUTPUT"
          echo "plan=$(base64 -w0 /tmp/plan.json)" >> "$GITHUB_OUTPUT"

  pr:
    needs: plan
    if: needs.plan.outputs.groups != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
    env:
      HAS_APP: ${{ secrets.DONERAM_APP_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAN: ${{ needs.plan.outputs.plan }}
          GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          echo "$PLAN" | base64 -d > /tmp/plan.json
          if jq -e --arg g "$GROUP" '.groups[]? | select(.id == $g)' /tmp/plan.json > /dev/null; then
            go run ./cmd/doneram update --plan /tmp/plan.json --group "$GROUP" --output /tmp/doneram.json
          else
            echo 'has_upgrades=false' >> "$GITHUB_OUTPUT"
          fi

      # GITHUB_TOKEN cannot push a branch that edits .github/workflows/**.
      # When the doneram app is installed with secrets set, its scoped
      # installation token covers that push; otherwise the job token opens
      # the PR and any workflow-file patch fails the push loudly.
      - id: app-token
        if: env.HAS_APP == 'true' && steps.check.outputs.has_upgrades == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.DONERAM_APP_CLIENT_ID }}
          private-key: ${{ secrets.DONERAM_APP_PRIVATE_KEY }}

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: steps.check.outputs.has_upgrades == 'true'
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          branch: doneram/${{ matrix.group }}
          draft: true
          delete-branch: true
          title: ${{ steps.check.outputs.title }}
          body: ${{ steps.check.outputs.body }}
